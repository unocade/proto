name: proto-ci
on:
  push:
  workflow_dispatch:

# Default to read-only. The publish steps authenticate with a PAT
# (secrets.ACCESS_TOKEN), so no workflow token write scope is needed.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Do not cancel in progress: the publish steps push to master and create
  # tags, and a half-finished run should not be interrupted.
  cancel-in-progress: false

jobs:
  lint:
    name: protolint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # Install Go with caching
      - name: Install Go
        uses: actions/setup-go@v6.3.0
        with:
          go-version: 1.26.0
          cache: true

      # Pinned for reproducibility: a different protolint version can add or
      # rename rules and change what passes.
      - name: Install protolint
        run: go install github.com/yoheimuta/protolint/cmd/protolint@v0.58.0

      - name: Lint protos
        run: protolint lint .protolint.yaml proto/

  proto:
    name: generate and publish
    # Lint gates the generation and the release.
    needs: lint
    # The generation and the publish are restricted the same way the publish
    # is: a push to dev, or a manual dispatch on dev or master. A push to
    # master (which is what this job itself does) must never publish again.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest

    # The runner image has no git identity: the `runner` user's GECOS entry is
    # empty, so `git commit-tree` and `git tag -a` fail with
    # "empty ident name ... not allowed" unless an identity is supplied.
    # These cover every git command in this job, including the tag.
    env:
      GIT_AUTHOR_NAME: '502BadPing'
      GIT_AUTHOR_EMAIL: 'aditya.sen1hl@gmail.com'
      GIT_COMMITTER_NAME: '502BadPing'
      GIT_COMMITTER_EMAIL: 'aditya.sen1hl@gmail.com'

    steps:
      - uses: actions/checkout@v6

      # Install make (needed for your Makefile)
      - name: Install make
        run: |
          if ! command -v make &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y make
          fi

      # Install protoc
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "21.12"

      # Install Go with caching
      - name: Install Go
        uses: actions/setup-go@v6.3.0
        with:
          go-version: 1.26.0
          cache: true

      # Cache Go binaries (protoc plugins) to avoid rebuilding every run
      - name: Cache Go binaries
        uses: actions/cache@v5
        with:
          path: ~/go/bin
          key: go-binaries-${{ runner.os }}-${{ hashFiles('**/go.sum') }}

      # Install protoc plugins (pinned versions for reproducibility)
      # The plugin version is embedded in the generated file headers, so a
      # different version produces a diff in every generated file.
      - name: Install plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1

      # Generate protobuf files
      # protoc fails outright on a broken .proto, so this is also what
      # validates the sources. The generated pb/ is published below.
      - name: Generate protobuf
        run: make generate

      # ---------------------------------------------------------------------
      # Publish. The generated code is published to the `master` branch, not
      # to `dev`: dev is the source of truth for the .proto files, master is
      # the published branch and the only one that gets version tags.
      # The job-level condition already restricts this to a dev push or a
      # manual dispatch, so every case that gets here publishes.
      # ---------------------------------------------------------------------
      - name: Publish generated code
        id: publish
        env:
          PAT: ${{ secrets.ACCESS_TOKEN }}
        run: |
          # Also set the identity in the repo config, so any git command run
          # outside this step (or by a tool) sees it too.
          git config user.name '502BadPing'
          git config user.email 'aditya.sen1hl@gmail.com'

          # Tree to publish: this checkout's tree with the regenerated pb/
          # that the step above produced. pb/ is gitignored, so it has to be
          # force-added.
          git add -A -f pb/
          TREE=$(git write-tree)

          # Parent for the new commit: master's tip if master exists, else
          # this branch's HEAD (first publish).
          git fetch -q origin 'refs/heads/master:refs/remotes/origin/master' 2> /dev/null || true
          if git rev-parse --verify refs/remotes/origin/master > /dev/null 2>&1; then
            PARENT=$(git rev-parse refs/remotes/origin/master)
            if [ "$TREE" = "$(git rev-parse "$PARENT^{tree}")" ]; then
              echo "master is already up to date - nothing to publish"
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            PARENT=$(git rev-parse HEAD)
          fi

          # A commit whose parent is master's tip, so the push is always a
          # fast-forward. No checkout, no force push.
          COMMIT=$(git commit-tree "$TREE" -p "$PARENT" -m 'chore(pb): regenerate protobuf bindings')
          echo "Publishing $COMMIT to master"
          # Authenticate with the PAT instead of the workflow token, so the
          # push is attributed to the PAT owner and triggers CI.
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PAT" | base64 -w0)" \
            push origin "$COMMIT:refs/heads/master"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Tag and publish release
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          COMMIT: ${{ steps.publish.outputs.commit }}
        run: |
          git fetch --tags --force
          latest=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          if [ -z "$latest" ]; then
            version='v0.1.0-dev'
          else
            plain=${latest#v}
            plain=${plain%%-*}
            major=$(echo "$plain" | cut -d. -f1)
            minor=$(echo "$plain" | cut -d. -f2)
            patch=$(echo "$plain" | cut -d. -f3)
            version="v${major}.${minor}.$((patch + 1))-dev"
          fi
          if git rev-parse -q --verify "refs/tags/$version" > /dev/null; then
            echo "Tag $version already exists - reusing it"
          else
            git tag -a "$version" "$COMMIT" -m "Release $version"
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
              push origin "refs/tags/$version"
          fi
          if gh release view "$version" > /dev/null 2>&1; then
            echo "Release $version already exists - nothing to publish"
            exit 0
          fi
          echo "Releasing $version"
          gh release create "$version" \
            --title "Release $version" \
            --notes 'Automated release generated by GitHub Actions' \
            --prerelease
