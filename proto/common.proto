syntax = "proto3";

package common;
option go_package = "./;pb";

// Shared messages across services
message RegisterServiceRequest {
  string service_name = 1;
  string service_port = 2;
}

message Empty {}

message RegisterServiceResponse {
  string message = 1;
}

message HealthCheckRequest {}

message HealthCheckResponse {
  string status = 1; // "ok" or "fail"
}

message Player {
  string ID = 1;
  string gamerTag = 2;
  string avatarURL = 3;
  bool isReady = 4;
}